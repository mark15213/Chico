# The dsh-chico-web-app bundle patch: the Chico investment surface over the
# dsh-web-app layer. Applied after web-app's patch, so rows here override that
# layer's rows by id, with the profile's own cordis.patch.yml and any --patch
# overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# This layer adds capability and the one surface that capability exists for:
# the market-data seam, one venue feed, the model-facing tools, the watchlist
# projection, and the browser tab that reads it. The price-series card needs no
# roster row — it is part of the shared render-intent union, so
# dsh-client-ui-tool already renders it. Everything else about the browser
# surface stays exactly as dsh-web-app left it.

- insert:
    # The followed-names registry and the one archive directory Chico's own
    # work lives in. `archivePath` is left unset so it resolves under the
    # harness home beside `sessions` and `storages`; a deployment that wants
    # the directory visible or synced points it elsewhere in a later layer.
    - id: followed-names
      name: '@deepseek-ai/dsh-followed-names'

    # The market-data seam. No provider is configured, so selection resolves to
    # the single usable one below; a deployment with a second feed adds it and
    # pins `provider` in a later patch layer rather than editing this row.
    - id: market-data
      name: '@deepseek-ai/dsh-market-data'
      config:
        maxHistorySessions: 500

    # The venue feed. Tushare serves end-of-day data for the mainland venues,
    # so every price here is a session close and the workbench says so.
    #
    # The account token is a credential reference, never a value in a shipped
    # file: it resolves through the credentials seam the base layer mounts, so
    # `TUSHARE_TOKEN` in the environment, in `$DSH_HOME/.env`, or in the managed
    # store all reach it. Without one the provider reports itself unusable and
    # the seam refuses loudly, which is the wanted failure — a workbench that
    # quietly served synthetic prices as real would be the worse outcome.
    #
    # `adjustment` stays `none` because restatement reads a second Tushare
    # interface gated behind a higher point threshold than the bars; an account
    # that has it sets `backward` here and gets history on today's basis.
    - id: market-data-tushare
      name: '@deepseek-ai/dsh-market-data-tushare'
      config:
        adjustment: none

    # The model-facing tools. Both are enabled; the default 60-session range is
    # what a chart card wants, and the seam's own ceiling bounds anything larger.
    - id: tool-market-data
      name: '@deepseek-ai/dsh-tool-market-data'
      config:
        quote: true
        history: true
        defaultHistorySessions: 60

    # The stance, the decision chain, and the sessions bound to one name. It
    # is deliberately independent of the follow flag, so a name can be studied
    # before it is followed.
    - id: name-record
      name: '@deepseek-ai/dsh-name-record'

    # The browser-facing join of the rows above, exposed as the `watchlist`
    # Remote namespace. It takes no config: what a user follows is data, and
    # which provider prices it is already the market-data row's decision.
    - id: watchlist
      name: '@deepseek-ai/dsh-watchlist'

    # ── browser roster ──────────────────────────────────────────────────────
    # The name workbench: one navigation frame in the sidebar and one detail
    # panel keyed to it. This is the only browser row Chico adds, and it is the
    # surface everything above exists to serve — a composition without it would
    # carry a record nobody can see.
    - id: ui-watchlist
      name: '@deepseek-ai/dsh-client-ui-watchlist'
