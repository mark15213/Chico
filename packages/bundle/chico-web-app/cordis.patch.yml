# The dsh-chico-web-app bundle patch: the Chico investment surface over the
# dsh-web-app layer. Applied after web-app's patch, so rows here override that
# layer's rows by id, with the profile's own cordis.patch.yml and any --patch
# overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# This layer adds the investment capability and its browser consumer: the
# market-data seam, one feed, the model-facing tools, durable followed-name and
# name-record state, the watchlist projection, and the investing frame. The
# shared price-series card needs no Chico row because dsh-client-ui-tool already
# renders it; ui-watchlist supplies the richer chart only for name-bound
# conversations.

- insert:
    # The followed-names registry and the one archive directory Chico's own
    # work lives in. `archivePath` is left unset so it resolves under the
    # harness home beside `sessions` and `storages`; a deployment that wants
    # the directory visible or synced points it elsewhere in a later layer.
    - id: followed-names
      name: '@deepseek-ai/dsh-followed-names'

    # The market-data seam. No provider is configured, so selection resolves to
    # the single usable one below; a deployment with a second feed adds it and
    # pins `provider` in a later patch layer rather than editing this row.
    - id: market-data
      name: '@deepseek-ai/dsh-market-data'
      config:
        maxHistorySessions: 500

    # The feed. **Every price this composition shows is synthetic**: the mock
    # provider answers from a dataset compiled into the package, with no
    # credential and no network.
    #
    # This is a development and demonstration composition. A live feed makes the
    # workbench unusable whenever the venue API is slow, rate-limited, or
    # unreachable — one failed request emptied the watchlist and left the
    # conversation without a quote — and none of that is the surface being
    # built. The dataset's magnitudes, volatilities, and 52-week ranges are
    # calibrated against real August-2026 observations, so the surface is
    # exercised against realistic shapes without depending on a venue being up.
    #
    # A deployment whose readers might act on the numbers replaces this row with
    # a real provider — `@deepseek-ai/dsh-market-data-tushare` is still in the
    # workspace and takes a `TUSHARE_TOKEN` credential reference.
    - id: market-data-mock
      name: '@deepseek-ai/dsh-market-data-mock'

    # The model-facing tools. Both are enabled; the default 60-session range is
    # what a chart card wants, and the seam's own ceiling bounds anything larger.
    - id: tool-market-data
      name: '@deepseek-ai/dsh-tool-market-data'
      config:
        quote: true
        history: true
        defaultHistorySessions: 60

    # The stance, the decision chain, and the sessions bound to one name. It
    # is deliberately independent of the follow flag, so a name can be studied
    # before it is followed.
    - id: name-record
      name: '@deepseek-ai/dsh-name-record'

    # The browser-facing join of the rows above, exposed as the `watchlist`
    # Remote namespace. It takes no config: what a user follows is data, and
    # which provider prices it is already the market-data row's decision.
    - id: watchlist
      name: '@deepseek-ai/dsh-watchlist'

    # ── browser roster ──────────────────────────────────────────────────────
    # The name workbench: one navigation frame in the sidebar and one detail
    # panel keyed to it. It is the surface everything above exists to serve —
    # a composition without it would carry a record nobody can see — and it
    # declares the workbench block the row below registers into.
    - id: ui-watchlist
      name: '@deepseek-ai/dsh-client-ui-watchlist'

    # Automations: the workbench block's first occupant, its management page in
    # the centre column, and the strip stating what watches a name above that
    # name's conversation.
    #
    # **The rules and their hits are a fixture compiled into the package.** No
    # condition is evaluated, nothing is stored, and nothing is delivered to a
    # conversation: the engine and the durable rule registry are host-side and
    # are not built yet. The row exists so the surface can be reviewed in the
    # assembled product rather than in isolation.
    - id: ui-automation
      name: '@deepseek-ai/dsh-client-ui-automation'
